<style>
:root {
  --bg: #f5f6f8; --surface: #fff; --text: #17202b; --muted: #5d6877; --line: #e2e6eb;
  --brand: #0b6bcb; --brand-ink: #fff; --good: #1a7f4b; --good-bg: #e7f6ee; --warn: #9a5b00; --warn-bg: #fff4e0;
  --bad: #b42318; --bad-bg: #fdecea; --chip: #eef1f5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #161d25; --text: #e6ecf2; --muted: #9aa6b3; --line: #27313c;
    --brand: #4c9ff0; --brand-ink: #0b1220; --good: #5fd39a; --good-bg: #13291f; --warn: #f0b35a; --warn-bg: #2b2112;
    --bad: #ff8a80; --bad-bg: #2c1716; --chip: #222b36;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--brand); }
nav { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
nav .in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
nav .brand { font-weight: 800; margin-right: 12px; }
nav a.tab { text-decoration: none; color: var(--text); padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 15px; }
nav a.tab.on, nav a.tab:hover { background: var(--chip); }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 26px; margin: 4px 0 16px; letter-spacing: -.02em; }
h2 { font-size: 19px; margin: 22px 0 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(4, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); } .g2 { grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { .g4, .g3, .g2 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .g4, .g3, .g2 { grid-template-columns: 1fr; } }
.stat { font-size: 32px; font-weight: 800; letter-spacing: -.02em; }
.muted { color: var(--muted); } .small { font-size: 14px; }
.btn { display: inline-block; border: 0; background: var(--brand); color: var(--brand-ink); padding: 9px 14px; border-radius: 9px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
.btn.small { padding: 5px 10px; font-size: 14px; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: 0; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--chip); }
.pill.good { background: var(--good-bg); color: var(--good); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.filters a { text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--text); font-size: 14px; background: var(--surface); }
.filters a.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
summary { font-weight: 700; cursor: pointer; }
.say { font-size: 17px; }
.tip { font-size: 14px; color: var(--warn); margin-top: 4px; }
textarea, input[type=date], input[type=text] { width: 100%; font: inherit; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.table-wrap { overflow-x: auto; }
@media print { nav, .noprint { display: none !important; } body { background: #fff; color: #000; } .card, details { border-color: #ccc; } }
</style>
