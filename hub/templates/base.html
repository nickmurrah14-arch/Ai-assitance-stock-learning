<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Business HQ{% endblock %} · {{ biz_name }}</title>
{% include "_style.html" %}
{% block head %}{% endblock %}
</head>
<body>
<nav><div class="in">
  <span class="brand">🏠 Business HQ</span>
  {% set p = request.path %}
  <a class="tab {{ 'on' if p == '/' }}" href="/">Home</a>
  <a class="tab {{ 'on' if p.startswith('/call') }}" href="/calls">📞 Calls</a>
  <a class="tab {{ 'on' if p.startswith('/drafts') }}" href="/drafts">✉️ Email drafts</a>
  <a class="tab {{ 'on' if p.startswith('/cheatsheet') }}" href="/cheatsheet">📋 Cheat sheet</a>
  <a class="tab {{ 'on' if p.startswith('/guides') }}" href="/guides">📚 Guides</a>
</div></nav>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
