{% extends "base.html" %}
{% block title %}Guides{% endblock %}
{% block body %}
<h1>📚 Guides</h1>
<div class="grid g2">
{% for slug, (title, path) in guides.items() %}
  <a class="card" href="/guides/{{ slug }}" style="text-decoration:none;color:inherit"><strong>{{ title }}</strong><div class="small muted">{{ path.name }}</div></a>
{% endfor %}
</div>
{% endblock %}
